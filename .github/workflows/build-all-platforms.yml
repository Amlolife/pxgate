name: Build All Platforms

on:
  push:
    branches:
      - 'main'  # Triggers on every push to main branch
      - 'master'  # Also support master branch
    tags:
      - 'v*'  # Triggers on version tags (v1.0.0, v2.1.3, etc.)
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows executable
        run: |
          pyinstaller pxgate-simple.spec --noconfirm --clean
      
      - name: Create Windows archive
        run: |
          Compress-Archive -Path dist\pxgate -DestinationPath Pxgate-Windows.zip
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pxgate-Windows
          path: Pxgate-Windows.zip
          retention-days: 30

  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-13  # Intel runner (x86_64)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Verify Python architecture
        run: |
          python -c "import platform; print(f'Python architecture: {platform.machine()}')"
          uname -m
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build macOS Intel app
        run: |
          rm -rf build dist
          pyinstaller pxgate-mac.spec --noconfirm --clean
      
      - name: Verify build architecture
        run: |
          file dist/Pxgate.app/Contents/MacOS/Pxgate
          echo "Expected: x86_64"
      
      - name: Create macOS Intel archive
        run: |
          cd dist
          zip -r ../Pxgate-macOS-Intel.zip Pxgate.app
          cd ..
      
      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pxgate-macOS-Intel
          path: Pxgate-macOS-Intel.zip
          retention-days: 30

  build-macos-arm:
    name: Build macOS Apple Silicon (M-Chip)
    runs-on: macos-14  # Apple Silicon runner (ARM64)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Verify Python architecture
        run: |
          python -c "import platform; print(f'Python architecture: {platform.machine()}')"
          uname -m
          echo "Expected: arm64 for native M-chip build"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Verify critical M-chip packages
        run: |
          python -c "import numpy; print(f'✓ numpy {numpy.__version__}')"
          python -c "import PySide6; print(f'✓ PySide6 {PySide6.__version__}')"
          python -c "import rawpy; print('✓ rawpy')"
          python -c "import pillow_heif; print('✓ pillow_heif')"
      
      - name: Build macOS ARM app (M-Chip optimized)
        run: |
          rm -rf build dist
          pyinstaller pxgate-mac.spec --noconfirm --clean
      
      - name: Verify build architecture
        run: |
          file dist/Pxgate.app/Contents/MacOS/Pxgate
          ARCH=$(file dist/Pxgate.app/Contents/MacOS/Pxgate | grep -o "arm64\|x86_64")
          echo "Build architecture: $ARCH"
          if [ "$ARCH" = "arm64" ]; then
            echo "✅ Native ARM64 build successful!"
          else
            echo "⚠️  Warning: Not ARM64 native"
          fi
      
      - name: Create macOS ARM archive
        run: |
          cd dist
          zip -r ../Pxgate-macOS-AppleSilicon.zip Pxgate.app
          cd ..
      
      - name: Upload macOS ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pxgate-macOS-AppleSilicon
          path: Pxgate-macOS-AppleSilicon.zip
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure of downloaded files
        run: ls -R artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Pxgate-Windows/Pxgate-Windows.zip
            artifacts/Pxgate-macOS-Intel/Pxgate-macOS-Intel.zip
            artifacts/Pxgate-macOS-AppleSilicon/Pxgate-macOS-AppleSilicon.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎉 Pxgate Release - Mac M-Chip Optimized
            
            ### ✨ What's New
            
            - ✅ **Native Apple Silicon (M1/M2/M3/M4) support** - 2-3x faster performance
            - ✅ **Fixed "App already running" error** on Mac first launch
            - ✅ **Automatic stale lock detection** - recovers from crashes
            - ✅ **Optimized multiprocessing** for Mac M-chip architecture
            
            ### 📦 Downloads
            
            Choose the appropriate version for your system:
            
            - **Windows**: `Pxgate-Windows.zip` (Windows 10+)
            - **macOS Intel**: `Pxgate-macOS-Intel.zip` (Intel-based Macs)
            - **macOS Apple Silicon**: `Pxgate-macOS-AppleSilicon.zip` (M1/M2/M3/M4 Macs) ⚡
            
            ### 📥 Installation
            
            #### Windows
            1. Download `Pxgate-Windows.zip`
            2. Extract the zip file
            3. Run `pxgate.exe`
            
            #### macOS
            1. Download the appropriate version for your Mac
               - Check: Apple menu → About This Mac → Chip
               - "Apple M1/M2/M3" = Apple Silicon
               - "Intel Core" = Intel
            2. Extract the zip file
            3. Drag `Pxgate.app` to your Applications folder
            4. **First launch**: Right-click → Open (to bypass Gatekeeper warning)
            5. Click "Open" in the security dialog
            6. The app will run normally from then on
            
            ### 💻 System Requirements
            
            - **Windows**: Windows 10 or later
            - **macOS Intel**: macOS 10.15 Catalina or later
            - **macOS Apple Silicon**: macOS 11.0 Big Sur or later (M1/M2/M3/M4)
            
            ### 📝 Notes
            
            - ✅ No Python installation required
            - ✅ All dependencies are bundled
            - ✅ Native ARM64 performance on M-chip Macs
            - ⚠️ First-time macOS users: Right-click → Open to bypass security warning
            
            ### 🐛 Bug Fixes
            
            - Fixed multiprocessing lock conflicts on macOS
            - Fixed stale lock file issues after crashes
            - Improved child process handling on Apple Silicon
            
            ### 📖 Documentation
            
            - See `MAC_INSTALLATION_GUIDE.md` for detailed Mac instructions
            - See `MAC_M_CHIP_COMPATIBILITY.md` for technical details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
