name: Build Mac M-Chip Only (Test)

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'build-fix'  # Also trigger on build-fix branch
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-macos-arm:
    name: Build macOS Apple Silicon (M1/M2/M3/M4)
    runs-on: macos-14  # Apple Silicon runner (ARM64)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Verify Python architecture
        run: |
          echo "=== System Information ==="
          uname -m
          python -c "import platform; print(f'Python architecture: {platform.machine()}')"
          echo "Expected: arm64 for native M-chip build"
          echo ""
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Verify critical M-chip packages
        run: |
          echo "=== Verifying M-chip Compatible Packages ==="
          python -c "import numpy; print(f'✓ numpy {numpy.__version__}')"
          python -c "import PySide6; print(f'✓ PySide6 {PySide6.__version__}')"
          python -c "import rawpy; print('✓ rawpy')"
          python -c "import pillow_heif; print('✓ pillow_heif')"
          python -c "import Pillow; from PIL import Image; print(f'✓ Pillow {Image.__version__}')"
          python -c "import psutil; print(f'✓ psutil {psutil.__version__}')"
          echo ""
      
      - name: Build macOS ARM app (M-Chip optimized)
        run: |
          echo "=== Building with PyInstaller ==="
          rm -rf build dist
          pyinstaller pxgate-mac.spec --noconfirm --clean
          echo ""
      
      - name: Verify build architecture
        run: |
          echo "=== Verifying Build Architecture ==="
          file dist/Pxgate.app/Contents/MacOS/Pxgate
          ARCH=$(file dist/Pxgate.app/Contents/MacOS/Pxgate | grep -o "arm64\|x86_64")
          echo ""
          echo "Build architecture: $ARCH"
          if [ "$ARCH" = "arm64" ]; then
            echo "✅ SUCCESS: Native ARM64 build!"
          else
            echo "❌ WARNING: Not ARM64 native (got $ARCH)"
            exit 1
          fi
          echo ""
      
      - name: Test app can be opened
        run: |
          echo "=== Testing App Structure ==="
          ls -lh dist/Pxgate.app/Contents/MacOS/
          echo ""
          echo "App bundle created successfully!"
      
      - name: Create macOS ARM archive
        run: |
          cd dist
          zip -r ../Pxgate-macOS-AppleSilicon-M-Chip.zip Pxgate.app
          cd ..
          ls -lh Pxgate-macOS-AppleSilicon-M-Chip.zip
      
      - name: Upload macOS ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pxgate-macOS-AppleSilicon-M-Chip
          path: Pxgate-macOS-AppleSilicon-M-Chip.zip
          retention-days: 30
      
      - name: Create Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Pxgate-macOS-AppleSilicon-M-Chip.zip
          draft: false
          prerelease: false
          body: |
            ## 🎉 Mac M-Chip Test Build
            
            ### ✨ What's Fixed
            
            - ✅ **Native Apple Silicon (M1/M2/M3/M4) support**
            - ✅ **Fixed "App already running" error** on first launch
            - ✅ **Automatic stale lock detection** - recovers from crashes
            - ✅ **Optimized multiprocessing** for Mac M-chip architecture
            
            ### 📦 Download
            
            - **macOS Apple Silicon**: `Pxgate-macOS-AppleSilicon-M-Chip.zip` (M1/M2/M3/M4 Macs) ⚡
            
            ### 📥 Installation
            
            1. Download `Pxgate-macOS-AppleSilicon-M-Chip.zip`
            2. Extract the zip file
            3. Drag `Pxgate.app` to your Applications folder
            4. **First launch**: Right-click → Open (to bypass Gatekeeper warning)
            5. Click "Open" in the security dialog
            6. The app will run normally from then on
            
            ### 💻 System Requirements
            
            - **macOS**: 11.0 Big Sur or later
            - **Chip**: Apple M1, M2, M3, or M4
            
            ### 🐛 Bug Fixes in This Build
            
            - Fixed multiprocessing lock conflicts on macOS
            - Fixed stale lock file issues after crashes
            - Improved child process handling on Apple Silicon
            - Added PID-based lock verification
            
            ### ⚡ Performance
            
            Native ARM64 build provides 2-3x faster performance compared to Intel builds running via Rosetta 2.
            
            ### 📖 Documentation
            
            - See `MAC_INSTALLATION_GUIDE.md` for detailed instructions
            - See `MAC_M_CHIP_COMPATIBILITY.md` for technical details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
